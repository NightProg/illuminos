[package]
name = "illuminos"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = [
    "kernel",

]



[dependencies]
ovmf-prebuilt = "0.2.3"

[build-dependencies]
illuminos_kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
panic = "abort"


[profile.release]
panic = "abort"


[patch.crates-io]
illfs = { path = "../illfs" }
