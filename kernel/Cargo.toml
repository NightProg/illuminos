[package]
name = "illuminos_kernel"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"
force-frame-pointers = true


[profile.release]
panic = "abort"
force-frame-pointers = true


[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.2"
pic8259 = "0.11.0"
linked_list_allocator = "0.9.0"
ata_x86 = "0.1.1"
bitflags = "2.9.0"
libm = "0.2.13"
pc-keyboard = "0.8.0"
illfs = { path = "../../illfs" }
elf = { version = "0.8.0", default-features = false, features = ["alloc", "to_str"] }
limine = "0.6.3"

rustc-demangle = { version = "0.1.27", default-features = false }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]
