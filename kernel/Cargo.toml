[package]
name = "illuminos_kernel"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader_api = "0.11"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.2"
pic8259 = "0.11.0"
linked_list_allocator = "0.9.0"
ata_x86 = "0.1.1"
bitflags = "2.9.0"
libm = "0.2.13"
pc-keyboard = "0.8.0"
illfs = "0.9.0"
elf = { version = "0.8.0", default-features = false, features = ["alloc", "to_str"] }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[dependencies.goblin]
version = "0.9.3"
default-features = false
features = ["elf32", "elf64", "alloc", "endian_fd"]

[patch.crates-io]
illfs = { path = "../../illfs" }
